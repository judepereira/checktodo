version: v1.0
name: Initial Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Checkout
    task:
      jobs:
        - name: Checkout
          commands:
            - checkout
      env_vars:
        - name: FOO_1
          value: ''
    dependencies: []
  - name: Compile
    task:
      jobs:
        - name: Compile
          commands:
            - echo "Compiled!"
    dependencies:
      - Checkout
  - name: Build Image
    task:
      jobs:
        - name: Build arm64
          commands:
            - echo "arm64 built!"
        - name: Build x86_64
          commands:
            - echo "x86 built!"
    dependencies:
      - Compile
  - name: Message Slack
    dependencies:
      - Build Image
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - echo "Slack Messaged!"
promotions:
  - name: Deploy to eu1-staging-1
    pipeline_file: pipeline_2.yml
    deployment_target: eu1-staging-1
    parameters:
    	env_vars:
     		- required: true
          name: Stack
        	default_value: eu1-staging-1
    auto_promote:
      when: result = 'passed'
  - name: Deploy to eu1-staging-2
    pipeline_file: pipeline_2.yml
    deployment_target: eu1-staging-2
    auto_promote:
      when: result = 'passed'
    parameters:
      env_vars:
        - required: false
          options: []
          default_value: ''
          description: ''
          name: TTL
        - required: true
          options:
            - Option 4
            - Cat
            - Dog
            - Mouse
          default_value: ''
          description: ''
          name: Example Select
  - name: Deploy Manually
    pipeline_file: pipeline_2.yml
    parameters:
      env_vars:
        - required: true
          options:
            - eu1-staging-1
            - eu1-staging-2
          default_value: ''
          description: ''
          name: Stack
  - name: Promotion 4
    pipeline_file: pipeline_2.yml
