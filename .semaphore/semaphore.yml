version: v1.0
name: Initial Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Checkout
    task:
      jobs:
        - name: Checkout
          commands:
            - checkout
            - echo hello
      env_vars:
        - name: FOO_1
          value: ''
    dependencies: []
  - name: Compile
    task:
      jobs:
        - name: Compile
          commands:
            - echo "Compiled!"
    dependencies:
      - Checkout
  - name: Build Image
    task:
      jobs:
        - name: Build arm64
          commands:
            - echo "arm64 built!"
        - name: Build x86_64
          commands:
            - echo "x86 built!"
    dependencies:
      - Run Tests
  - name: Message Slack
    dependencies:
      - Build Image
    task:
      jobs:
        - name: echo
          commands:
            - echo "Slack Messaged!"
  - name: Run Tests
    dependencies:
      - Compile
    task:
      jobs:
        - name: Create & push HTML Report
          commands:
            - mkdir -p report
            - echo "<h1>Hello world (a)</h1><br><a href='b.html'>go to b.html</a>" >> report/a.html
            - echo "<h1>Hello world (b)</h1><br><a href='a.html'>go to a.html</a>" >> report/b.html
            - artifact push workflow report
promotions:
  - name: Deploy to eu1-staging-1
    pipeline_file: pipeline_2.yml
    deployment_target: eu1-staging-1
    parameters:
      env_vars:
        - required: true
          name: Stack
          default_value: eu1-staging-1
          description: ''
          options: []
    auto_promote:
      when: result = 'passed'
  - name: Deploy to eu1-staging-2
    pipeline_file: pipeline_2.yml
    deployment_target: eu1-staging-2
    auto_promote:
      when: result = 'passed'
    parameters:
      env_vars:
        - required: false
          options: []
          default_value: ''
          description: ''
          name: TTL
        - required: true
          options:
            - Option 4
            - Cat
            - Dog
            - Mouse
          default_value: ''
          description: ''
          name: Example Select
