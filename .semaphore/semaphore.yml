version: v1.0
name: Initial Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Checkout
    task:
      jobs:
        - name: Checkout
          commands:
            - checkout
  - name: Compile
    task:
      jobs:
        - name: Compile
          commands:
            - echo "Compiled!"
  - name: Build Image
    task:
      jobs:
        - name: Build arm64
          commands:
            - echo "arm64 built!"
        - name: Build x86_64
          commands:
            - echo "x86 built!"
promotions:
  - name: Promote to eu1-staging-1
    pipeline_file: pipeline_2.yml
    deployment_target: eu1-staging-1
